miner:
  storage-limit: 2304
  material: COBBLESTONE
  amount-per-cycle: 1
  sell-price-per-item: 1.0
  display-name: "<gold>Minero de <yellow><owner>"
  armor-color:
    red: 181
    green: 143
    blue: 78

production:
  amount-per-cycle: 1
  speed-reduction-per-level: 1.0
  minimum-interval-seconds: 1.0
  base-interval-seconds:
    COBBLESTONE: 10.0
    STONE: 11.0
    COAL: 12.0
    COPPER: 14.0
    IRON: 15.0
    GOLD: 18.0
    REDSTONE: 14.0
    LAPIS: 16.0
    DIAMOND: 25.0
    EMERALD: 28.0
    QUARTZ: 15.0
    NETHERITE: 45.0
    OBSIDIAN: 30.0
    NETHERRACK: 9.0
    END_STONE: 18.0
    SAND: 9.0
    GRAVEL: 10.0
    CLAY: 12.0
    DIRT: 8.0
    OAK: 10.0
    SPRUCE: 11.0
    BIRCH: 11.0
    JUNGLE: 12.0
    ACACIA: 13.0
    DARK_OAK: 14.0
    BAMBOO: 8.0
    CACTUS: 10.0
    WHEAT: 10.0
    CARROT: 10.0
    POTATO: 10.0

language:
  default: en

starter-minion: COBBLESTONE

minion-upgrades:
  max-level: 15
  base-price: 200.0
  speed-reduction-per-level: 0.5
  minimum-interval-seconds: 1.0
  # 0.05 means every minion level adds 5% to that resource's sale value.
  value-increase-per-level: 0.05

