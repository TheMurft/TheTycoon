scoreboard:
  enabled: true
  update-interval-ticks: 40
  title: "&6&lTHE TYCOON"
  footer: "play.yourserver.net"
  # Maximum 15 lines. Reorder, remove or add any line.
  # Variables: {player}, {plot}, {money}, {prestige}, {minions}, {max_minions},
  # {stored}, {profit}, {speed}, {playtime}, {offline_money}, {lifetime_earnings}, {items_sold},
  # {online}, {max_online}, {footer}, and every {name_label} used below.
  lines:
    - "&8&m--------------------"
    - "&e&l{player}"
    - ""
    - "&f{plot_label}: &6#{plot}"
    - "&f{money_label}: &a${money}"
    - "&f{prestige_label}: &d{prestige}"
    - "&f{minions_label}: &b{minions}&7/&b{max_minions}"
    - ""
    - "&f{stored_label}: &e{stored}"
    - "&f{profit_label}: &a+{profit}%"
    - "&f{speed_label}: &b+{speed}%"
    - ""
    - "&7{playtime_label}: &f{playtime}"
    - "&e{footer}"

progression:
  offline-production:
    enabled: true
    # Offline time has no limit. 0.75 pays 75% of normal connected earnings.
    money-rate: 0.75
  prestige:
    base-cost: 100000.0
    cost-growth: 2.0
    profit-bonus-per-level: 0.10
  missions:
    1: {required-items: 100, reward: 500.0}
    2: {required-items: 1000, reward: 5000.0}
    3: {required-items: 10000, reward: 50000.0}
    4: {required-items: 100000, reward: 500000.0}
    5: {required-items: 1000000, reward: 5000000.0}
