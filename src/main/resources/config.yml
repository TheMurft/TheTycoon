economy:
  # Shortens large values everywhere: 12500 -> 12.5K, 1000000000 -> 1B.
  compact-format: true
  compact-decimal-places: 2
  starting-balance: 0.0
  currency-singular: Coin
  currency-plural: Coins
  decimal-places: 2

plots:
  size: 16
  road-width: 5
  # Plot packs automatically use the most square grid possible (25 = 5x5).
  square-layout: true
  border-material: POLISHED_ANDESITE
  ground-material: GRASS_BLOCK
  foundation-material: DIRT
  # Multi-floor foundation. Increase floors before generating/resetting plots.
  floors: 1
  floor-height: 5
  floor-material: SMOOTH_STONE

# Minions keep producing even when their Armor Stand is not rendered.
performance:
  # Master switch. false restores the original behavior and renders every active minion.
  enabled: true
  dynamic-rendering: true
  render-distance: 32.0
  # Both limits apply together. With 20 active plots the server still never exceeds the global budget.
  max-rendered-per-plot: 32
  max-rendered-global: 256
  visibility-check-ticks: 40
  animations-enabled: true
  animation-interval-ticks: 10
  animation-batch-size: 64
  production-check-ticks: 20
  save-interval-ticks: 600

shop:
  minion-limit: 3
  # Slot milestones: 3 -> 4 -> 8 -> 16 -> 32 -> 64 -> 128 -> 256.
  max-minion-limit: 256
  max-storage-level: 25
  max-profit-level: 20
  max-speed-level: 20
  minion-limit-upgrade-price: 1000.0
  storage-upgrade-price: 750.0
  profit-upgrade-price: 1500.0
  speed-upgrade-price: 2000.0
  minion-limit-price-growth: 2.25
  storage-price-growth: 1.55
  profit-price-growth: 1.70
  speed-price-growth: 1.85
  profit-per-level: 0.10
  speed-per-level: 0.05
  minions:
    COBBLESTONE: {price: 100.0, sell-price: 1.0}
    STONE: {price: 150.0, sell-price: 1.25}
    COAL: {price: 250.0, sell-price: 2.5}
    COPPER: {price: 400.0, sell-price: 4.0}
    IRON: {price: 500.0, sell-price: 5.0}
    GOLD: {price: 1000.0, sell-price: 10.0}
    REDSTONE: {price: 700.0, sell-price: 6.0}
    LAPIS: {price: 850.0, sell-price: 7.5}
    DIAMOND: {price: 2500.0, sell-price: 25.0}
    EMERALD: {price: 3500.0, sell-price: 35.0}
    QUARTZ: {price: 650.0, sell-price: 6.0}
    NETHERITE: {price: 15000.0, sell-price: 150.0}
    OBSIDIAN: {price: 4500.0, sell-price: 40.0}
